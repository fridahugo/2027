<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brollop Fullscreen</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .frame {
            width: 100vw;
            height: 100dvh;
        }

        @supports not (height: 100dvh) {
            .frame {
                height: 100vh;
            }
        }

        .frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>
    <div class="frame">
        <img src="./Brollop.png" alt="Brollop" />
    </div>
</body>

</html>
